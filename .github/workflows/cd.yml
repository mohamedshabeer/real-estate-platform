name: CD Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Docker Image
        run: |
          docker build -t gcr.io/project-id/real-estate-platform:latest .
          docker push gcr.io/project-id/real-estate-platform:latest

      - name: Deploy to Kubernetes
        run: |
          gcloud auth configure-docker
          kubectl apply -f k8s/